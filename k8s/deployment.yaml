apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-app
  template:
    metadata:
      labels:
        app: task-app
    spec:
      containers:
        - name: task-app
          image: hashirkhan1/task-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
            